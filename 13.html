<!DOCTYPE html>
<html lang="id">
<head>
    <title>Elemen Block dan Inline</title>
</head>
<body>
    <h2>Contoh Elemen Block</h2>
    <p>Tag &lt;p&gt;, &lt;div&gt;, dan &lt;h1&gt; adalah contoh elemen block yang selalu turun ke baris baru.</p>
    <div style="background-color: #f0f0f0; border: 1px solid #ccc;">Ini adalah elemen div (block).</div>

    <h2>Contoh Elemen Inline</h2>
    <p>Tag seperti <span style="background-color: lightgreen;">&lt;span&gt;</span>, <strong>&lt;strong&gt;</strong>, dan <a href="#">&lt;a&gt;</a> tidak membuat baris baru.</p>
</body>
</html>
