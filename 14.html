<!DOCTYPE html>
<html lang="id">
<head>
    <title>Iframe HTML</title>
</head>
<body>
    <h2>Menyematkan Konten Eksternal (Iframe)</h2>
    
    <p>Contoh menyematkan peta dari Google Maps:</p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3979.829143973!2d119.366!3d-3.416!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zM8KwMjUnMDAuMCJTIDExOcKwMjInMDAuMCJF!5e0!3m2!1sid!2sid!4v1234567890" 
            width="600" 
            height="350" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
    </iframe>
</body>
</html>
