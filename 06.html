<!DOCTYPE html>
<html lang="id">
<head>
    <title>List HTML</title>
</head>
<body>
    <h2>Daftar Berurutan (Ordered List)</h2>
    <ol>
        <li>Buka Text Editor</li>
        <li>Tulis Kode HTML</li>
        <li>Simpan dan Buka di Browser</li>
    </ol>

    <h2>Daftar Tidak Berurutan (Unordered List)</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
