<!DOCTYPE html>
<html lang="id">
<head>
    <title>Format Teks HTML</title>
</head>
<body>
    <h1>Format Teks</h1>
    <p>Ini <b>teks tebal</b> dan ini <i>teks miring</i>.</p>
    <p>Ini <strong>teks penting (strong)</strong> dan ini <em>teks penekanan (emphasis)</em>.</p>
    <p>Formula kimia air: H<sub>2</sub>O</p>
    <p>Persamaan kuadrat: x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>
    <p>Teks <mark>disorot (highlight)</mark> dan teks <del>dicoret</del>.</p>
</body>
</html>
