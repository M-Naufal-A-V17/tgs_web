<!DOCTYPE html>
<html lang="id">
<head>
    <title>Atribut Global HTML</title>
    <style>
        .highlight { background-color: yellow; }
        #utama { color: darkblue; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Menggunakan atribut id, class, title, dan style -->
    <h1 id="utama" title="Judul Utama Dokumen">Pengenalan Atribut Global</h1>
    
    <p class="highlight">Paragraf ini memiliki latar belakang kuning karena menggunakan class CSS.</p>
    
    <p style="color: red; font-style: italic;">Paragraf ini menggunakan inline style warna merah.</p>
</body>
</html>
