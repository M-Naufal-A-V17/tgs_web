<!DOCTYPE html>
<html lang="id">
<head>
    <title>Link HTML</title>
</head>
<body>
    <h2>Belajar Membuat Link</h2>
    <!-- Link eksternal -->
    <p>Kunjungi <a href="https://www.petanikode.com" target="_blank">Petani Kode</a>.</p>

    <!-- Link internal / anchor -->
    <p>Kirim pesan ke <a href="mailto:admin@example.com">Email Admin</a>.</p>
</body>
</html>
